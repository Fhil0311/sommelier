name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Sommelier.xcodeproj -scheme Sommelier -configuration Debug -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: server/api
      - run: npm test
        working-directory: server/api
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit signed off
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "commit $c has no Signed-off-by"; exit 1; }
          done
